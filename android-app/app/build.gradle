plugins {
    id 'com.android.application'
    id 'idea'
}

android {
    // RestroSuite product ID. Changing applicationId creates a NEW Play Store
    // listing (com.doppiocafe.pos installs will not auto-update onto this ID).
    namespace 'com.restrosuite.pos'
    compileSdk 34

    defaultConfig {
        applicationId "com.restrosuite.pos"
        minSdk 24
        targetSdk 34
        // IMPORTANT: bump versionCode by at least 1 (and versionName to match)
        // on every Play Store release. versionCode is per applicationId, so
        // this fresh package can start at 1 — keep bumping on each upload.
        versionCode 2
        versionName "2.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // -----------------------------------------------------------------------
    // Release signing configuration
    // Set these four properties in your local gradle.properties (never commit
    // the keystore or credentials to version control):
    //
    //   RELEASE_STORE_FILE=../release.jks
    //   RELEASE_STORE_PASSWORD=<keystore-password>
    //   RELEASE_KEY_ALIAS=<key-alias>
    //   RELEASE_KEY_PASSWORD=<key-password>
    //
    // Generate a new keystore with:
    //   keytool -genkeypair -v -keystore release.jks -alias <alias> \
    //           -keyalg RSA -keysize 2048 -validity 10000
    // -----------------------------------------------------------------------
    signingConfigs {
        release {
            storeFile     file(project.findProperty("RELEASE_STORE_FILE")     ?: "release.jks")
            storePassword      project.findProperty("RELEASE_STORE_PASSWORD") ?: ""
            keyAlias           project.findProperty("RELEASE_KEY_ALIAS")      ?: ""
            keyPassword        project.findProperty("RELEASE_KEY_PASSWORD")   ?: ""
        }
    }

    buildTypes {
        debug {
            // Debug builds use the auto-generated debug keystore — no extra config needed.
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Required on AGP 8+/9 — BuildConfig is opt-in
    buildFeatures {
        buildConfig true
    }
}

// Tell Android Studio's file indexer to exclude the build output directory.
// This prevents it from holding Windows file handles on intermediate dex files.
idea {
    module {
        excludeDirs += [file("build")]
    }
}

// ---------------------------------------------------------------------------
// Force-remove Windows-locked dex intermediate directories before each build.
// Android Studio's "Apply Changes" / file indexer holds exclusive handles on
// these folders. Java NIO cannot delete locked files on Windows, but the
// native cmd.exe rmdir command can bypass the lock.
// ---------------------------------------------------------------------------
task forceCleanDexIntermediates {
    doFirst {
        def targets = [
            "${buildDir}/intermediates/project_dex_archive",
            "${buildDir}/intermediates/desugar_graph",
            "${buildDir}/intermediates/merged_res",
            "${buildDir}/intermediates/merged_res_blame_folder",
            "${buildDir}/intermediates/incremental/debug/mergeDebugResources",
            "${buildDir}/intermediates/incremental/packageDebugResources",
        ]
        targets.each { path ->
            if (file(path).exists()) {
                logger.lifecycle("Force-removing locked directory: $path")
                new ProcessBuilder('cmd', '/c', 'rmdir', '/s', '/q', path)
                    .redirectErrorStream(true)
                    .start()
                    .waitFor()
            }
        }
    }
}

preBuild.dependsOn forceCleanDexIntermediates

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // Offline-lease: encrypted at-rest storage for the license token.
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    // Secure local asset serving (https://appassets.androidplatform.net/...)
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.annotation:annotation:1.7.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
