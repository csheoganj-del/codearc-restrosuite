<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#0F0E0D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <title>Table · RestroSuite</title>
  <link rel="icon" href="assets/restrosuite-mark.png?v=3" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@450;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="config.js"></script>
  <style>
    :root {
      --brand: #FF4F00;
      --brand-2: #FF7A3D;
      --ink: #0F0E0D;
      --ink2: #3D3A36;
      --muted: #8A847C;
      --line: rgba(15,14,13,.08);
      --surf: #FFFFFF;
      --bg: #F3F0EA;
      --ok: #0F9F6E;
      --warn: #C27803;
      --bad: #DC2626;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --ease: cubic-bezier(.22,1,.36,1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      -webkit-tap-highlight-color: transparent;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    body {
      min-height: 100dvh;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      overflow: hidden; /* home never scrolls */
    }

    /* ── HOME: locked to one screen ── */
    .home {
      width: 100%;
      max-width: 430px;
      height: 100dvh;
      height: 100vh;
      max-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding:
        max(12px, var(--safe-t))
        16px
        max(12px, var(--safe-b));
      gap: 0;
      overflow: hidden;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex: 0 0 auto;
      min-height: 36px;
    }
    .chip {
      display: none;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 999px;
      background: #E8F8F1;
      color: var(--ok);
      letter-spacing: .01em;
    }
    .chip.on { display: inline-flex; }
    .chip .d {
      width: 6px; height: 6px; border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 0 3px rgba(15,159,110,.15);
    }
    .chip.warn { background: #FEF3C7; color: #B45309; }
    .chip.bad { background: #FEE2E2; color: #B91C1C; }
    .lang {
      border: 1px solid var(--line);
      background: var(--surf);
      border-radius: 999px;
      padding: 6px 11px;
      font-size: 11px;
      font-weight: 800;
      color: var(--ink2);
      cursor: pointer;
      font-family: inherit;
      letter-spacing: .04em;
    }

    .brand {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 10px;
      margin-bottom: 14px;
      min-height: 0;
    }
    .brand img {
      width: 44px; height: 44px;
      border-radius: 12px;
      object-fit: cover;
      background: #fff;
      border: 1px solid var(--line);
      flex-shrink: 0;
    }
    .brand-txt { min-width: 0; flex: 1; }
    .brand-name {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -.03em;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .brand-meta {
      margin-top: 3px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .tbl {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--ink);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      letter-spacing: .02em;
    }
    .hint {
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
    }

    .offline {
      display: none;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #FEE2E2;
      color: #B91C1C;
      border-radius: 10px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .offline.on { display: flex; }

    .alert {
      display: none;
      flex: 0 0 auto;
      align-items: center;
      gap: 8px;
      background: #FEF3C7;
      color: #92400E;
      border-radius: 12px;
      padding: 9px 11px;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.35;
      margin-bottom: 8px;
    }
    .alert.on { display: flex; }
    .alert.bad { background: #FEE2E2; color: #991B1B; }
    .alert button {
      margin-left: auto;
      border: 0;
      background: rgba(0,0,0,.08);
      border-radius: 8px;
      padding: 5px 8px;
      font-weight: 800;
      font-size: 11px;
      cursor: pointer;
      font-family: inherit;
      color: inherit;
      white-space: nowrap;
    }

    /* Actions fill remaining height */
    .actions {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-rows: 1.35fr 1fr;
      gap: 10px;
    }
    .row3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      min-height: 0;
    }

    .tile {
      position: relative;
      border: 0;
      border-radius: 20px;
      background: var(--surf);
      box-shadow: 0 1px 0 var(--line), 0 8px 24px rgba(15,14,13,.04);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      text-align: left;
      cursor: pointer;
      font-family: inherit;
      color: inherit;
      text-decoration: none;
      min-height: 0;
      overflow: hidden;
      transition: transform .18s var(--ease);
      -webkit-user-select: none;
      user-select: none;
    }
    .tile:active { transform: scale(.98); }
    .tile:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
    .tile.disabled { opacity: .45; pointer-events: none; }

    .tile.hero {
      background: linear-gradient(145deg, #1A1714 0%, #2C2620 55%, #1A1714 100%);
      color: #FDF8F4;
      box-shadow: 0 14px 36px rgba(15,14,13,.22);
      padding: 18px 18px 16px;
    }
    .tile.hero .ico {
      width: 48px; height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      color: #fff;
      display: grid; place-items: center;
      font-size: 20px;
      box-shadow: 0 8px 20px rgba(255,79,0,.35);
    }
    .tile.hero .title {
      font-size: clamp(22px, 6.2vw, 28px);
      font-weight: 800;
      letter-spacing: -.04em;
      line-height: 1.05;
      margin-top: auto;
      padding-top: 18px;
    }
    .tile.hero .sub {
      margin-top: 6px;
      font-size: 13px;
      color: rgba(253,248,244,.62);
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .tile.hero .go {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 800;
      color: #fff;
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.14);
      padding: 7px 12px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .tile .ico {
      width: 38px; height: 38px;
      border-radius: 12px;
      background: rgba(255,79,0,.1);
      color: var(--brand);
      display: grid; place-items: center;
      font-size: 16px;
    }
    .tile .title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -.02em;
      line-height: 1.15;
      margin-top: auto;
      padding-top: 14px;
    }
    .tile .sub {
      margin-top: 3px;
      font-size: 11.5px;
      color: var(--muted);
      font-weight: 500;
      line-height: 1.25;
    }
    .badge {
      position: absolute;
      top: 12px; right: 12px;
      min-width: 20px; height: 20px;
      padding: 0 6px;
      border-radius: 999px;
      background: var(--brand);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .badge.on { display: inline-flex; }

    .foot {
      flex: 0 0 auto;
      text-align: center;
      font-size: 10.5px;
      color: var(--muted);
      margin-top: 10px;
      line-height: 1.3;
      opacity: .85;
    }
    .foot a { color: var(--brand); font-weight: 700; text-decoration: none; }

    /* Short phones tighten further */
    @media (max-height: 700px) {
      .brand { margin-top: 6px; margin-bottom: 10px; }
      .brand img { width: 38px; height: 38px; border-radius: 10px; }
      .brand-name { font-size: 15.5px; }
      .tile { padding: 12px; border-radius: 16px; }
      .tile.hero { padding: 14px; }
      .tile.hero .ico { width: 40px; height: 40px; border-radius: 12px; font-size: 17px; }
      .tile.hero .title { font-size: 22px; padding-top: 12px; }
      .tile .ico { width: 34px; height: 34px; border-radius: 10px; font-size: 14px; }
      .tile .title { font-size: 13px; padding-top: 10px; }
      .actions { gap: 8px; }
      .row3 { gap: 8px; }
    }
    @media (max-height: 600px) {
      .hint { display: none; }
      .foot { display: none; }
      .tile.hero .sub span:first-child { display: none; }
    }

    /* ── Sheets / overlays (scroll ok) ── */
    .overlay {
      position: fixed; inset: 0; z-index: 1000;
      background: rgba(15,14,13,.5);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex; align-items: flex-end; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity .25s ease;
    }
    .overlay.on { opacity: 1; pointer-events: auto; }
    .overlay.center { align-items: center; padding: 20px; }
    .sheet {
      width: 100%; max-width: 430px;
      background: var(--surf);
      border-radius: 22px 22px 0 0;
      padding: 8px 16px calc(18px + var(--safe-b));
      max-height: min(88dvh, 640px);
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform .3s var(--ease);
      box-shadow: 0 -16px 48px rgba(0,0,0,.18);
    }
    .overlay.on .sheet { transform: translateY(0); }
    .overlay.center .sheet {
      border-radius: 20px;
      transform: scale(.96);
      max-width: 340px;
      padding: 22px 18px calc(18px + var(--safe-b));
    }
    .overlay.center.on .sheet { transform: scale(1); }
    .handle {
      width: 36px; height: 4px; border-radius: 99px;
      background: var(--line); margin: 4px auto 12px;
    }
    .overlay.center .handle { display: none; }
    .sh-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; margin-bottom: 14px;
    }
    .sh-title {
      font-size: 18px; font-weight: 800; letter-spacing: -.03em;
    }
    .x {
      width: 34px; height: 34px; border-radius: 10px;
      border: 1px solid var(--line); background: var(--bg);
      color: var(--ink2); cursor: pointer;
      display: grid; place-items: center; font-size: 13px;
    }

    .svc {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    }
    .svc-btn {
      border: 1px solid var(--line); background: var(--bg);
      border-radius: 14px; padding: 14px 8px;
      display: flex; flex-direction: column; align-items: center; gap: 7px;
      cursor: pointer; font-family: inherit; font-weight: 700; font-size: 12px;
      color: var(--ink); min-height: 84px;
    }
    .svc-btn i { font-size: 18px; color: var(--brand); }
    .svc-btn:active { border-color: var(--brand); background: #FFF6F1; }
    .svc-btn:disabled { opacity: .5; }
    .svc-btn.wide {
      grid-column: 1 / -1; flex-direction: row; min-height: 48px; justify-content: center; gap: 8px;
    }

    .empty {
      text-align: center; padding: 24px 12px; color: var(--muted); font-size: 13px; line-height: 1.45;
    }
    .empty i { font-size: 28px; opacity: .3; display: block; margin-bottom: 8px; }

    .ord {
      border: 1px solid var(--line); border-radius: 14px;
      padding: 12px; margin-bottom: 10px; background: #fff;
    }
    .ord-h {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px;
    }
    .oid { font-weight: 800; font-size: 13px; color: var(--brand); }
    .om { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .pill {
      font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 999px;
      text-transform: uppercase; letter-spacing: .03em; white-space: nowrap;
    }
    .p-pend { background: #FEF3C7; color: #B45309; }
    .p-prep { background: #FFEDD5; color: #C2410C; }
    .p-serv { background: #D1FAE5; color: #047857; }
    .p-paid { background: #E0E7FF; color: #3730A3; }

    .tl { position: relative; padding-left: 18px; margin-top: 6px; }
    .tl::before {
      content: ''; position: absolute; left: 4px; top: 4px; bottom: 4px; width: 2px; background: var(--line);
    }
    .ts { position: relative; padding: 0 0 10px; }
    .ts:last-child { padding-bottom: 0; }
    .td {
      position: absolute; left: -18px; top: 2px; width: 10px; height: 10px; border-radius: 50%;
      background: #fff; border: 2px solid var(--line);
    }
    .ts.done .td { background: var(--ok); border-color: var(--ok); }
    .ts.active .td { background: var(--brand); border-color: var(--brand); box-shadow: 0 0 0 3px rgba(255,79,0,.15); }
    .tt { font-size: 12.5px; font-weight: 700; color: var(--muted); }
    .ts.done .tt { color: var(--ok); }
    .ts.active .tt { color: var(--brand); }
    .tdesc { font-size: 11px; color: var(--muted); }

    .eta {
      margin: 4px 0 10px; padding: 10px; border-radius: 12px; text-align: center;
      border: 1px solid rgba(255,79,0,.18); background: rgba(255,79,0,.06);
    }
    .eta strong { display: block; font-size: 20px; color: var(--brand); font-weight: 800; }
    .lines { margin-top: 8px; border-top: 1px dashed var(--line); padding-top: 6px; }
    .li {
      display: flex; justify-content: space-between; font-size: 12px;
      padding: 2px 0; color: var(--ink2); gap: 8px;
    }

    .bill {
      background: var(--bg); border: 1px solid var(--line); border-radius: 14px;
      padding: 12px; margin-bottom: 12px;
    }
    .br {
      display: flex; justify-content: space-between; font-size: 13px;
      padding: 4px 0; color: var(--ink2); gap: 8px;
    }
    .br.tot {
      border-top: 1px solid var(--line); margin-top: 6px; padding-top: 9px;
      font-weight: 800; font-size: 16px; color: var(--ink);
    }
    .br.tot span:last-child { color: var(--brand); }

    .btn {
      width: 100%; border: 0; border-radius: 12px; padding: 13px 14px;
      font-family: inherit; font-weight: 800; font-size: 14px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      text-decoration: none; margin-top: 8px;
    }
    .btn-p { background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #fff; }
    .btn-d { background: var(--ink); color: #fff; }
    .btn-g { background: #fff; color: var(--ink); border: 1px solid var(--line); }
    .btn:disabled { opacity: .55; }
    .upi { text-align: center; }
    .qr {
      display: inline-flex; padding: 10px; background: #fff; border: 1px solid var(--line);
      border-radius: 12px; margin: 8px 0;
    }
    .qr img { width: 168px; height: 168px; display: block; }
    .field {
      width: 100%; background: var(--bg); border: 1px solid var(--line);
      border-radius: 11px; padding: 11px 12px; font-family: inherit; font-size: 15px;
      outline: none; margin: 6px 0 0;
    }
    .field:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(255,79,0,.12); background: #fff; }
    .lbl { font-size: 11.5px; font-weight: 700; color: var(--muted); margin-top: 10px; }

    .toast {
      position: fixed; left: 50%; bottom: calc(18px + var(--safe-b));
      transform: translateX(-50%) translateY(70px);
      background: var(--ink); color: #fff; font-weight: 700; font-size: 13px;
      padding: 11px 16px; border-radius: 999px; z-index: 2000; opacity: 0;
      transition: .3s var(--ease); max-width: min(90vw, 340px);
      text-align: center; pointer-events: none;
      box-shadow: 0 10px 28px rgba(0,0,0,.25);
    }
    .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spin {
      width: 24px; height: 24px; border: 2.5px solid var(--line);
      border-top-color: var(--brand); border-radius: 50%;
      animation: spin .75s linear infinite; margin: 0 auto;
    }
    .block-ico {
      width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 12px;
      display: grid; place-items: center; font-size: 22px;
      background: #FEE2E2; color: var(--bad);
    }
    .block-ico.warn { background: #FEF3C7; color: #B45309; }
    .block-t { font-size: 18px; font-weight: 800; text-align: center; margin-bottom: 6px; letter-spacing: -.02em; }
    .block-m { text-align: center; color: var(--muted); font-size: 13px; line-height: 1.45; margin-bottom: 14px; }
  </style>
</head>
<body>
  <div class="home" id="portal">
    <div class="top">
      <div class="chip" id="session-pill"><span class="d"></span><span id="session-pill-txt">Ready</span></div>
      <button type="button" class="lang" id="lang-btn" aria-label="Language">EN</button>
    </div>

    <div class="offline" id="offline"><i class="fa-solid fa-wifi"></i> <span data-i18n="offline">Offline</span></div>
    <div class="alert" id="sess-banner" role="status">
      <span id="sess-banner-txt"></span>
      <button type="button" id="sess-banner-refresh" data-i18n="retry">Retry</button>
    </div>

    <header class="brand">
      <img src="assets/restrosuite-mark.png" alt="" width="44" height="44" onerror="this.style.display='none'">
      <div class="brand-txt">
        <div class="brand-name" id="brand-logo">Loading…</div>
        <div class="brand-meta">
          <span class="tbl" id="table-badge"><i class="fa-solid fa-utensils" style="font-size:10px"></i> <span id="table-label">Table —</span></span>
          <span class="hint" data-i18n="noApp">No app needed</span>
        </div>
      </div>
    </header>

    <div class="actions" id="action-grid">
      <a href="#" class="tile hero" id="menu-btn">
        <div class="ico"><i class="fa-solid fa-utensils"></i></div>
        <div>
          <div class="title" data-i18n="menuTitle">Order food</div>
          <div class="sub">
            <span data-i18n="menuDesc">Menu · kitchen · to your table</span>
            <span class="go"><span data-i18n="menuCta">Open</span> <i class="fa-solid fa-arrow-right"></i></span>
          </div>
        </div>
      </a>

      <div class="row3">
        <button type="button" class="tile" id="service-card">
          <div class="ico"><i class="fa-solid fa-bell"></i></div>
          <div>
            <div class="title" data-i18n="svcTitle">Service</div>
            <div class="sub" data-i18n="svcDesc">Call staff</div>
          </div>
        </button>

        <button type="button" class="tile" id="tracker-card">
          <span class="badge" id="track-badge">0</span>
          <div class="ico"><i class="fa-solid fa-fire-burner"></i></div>
          <div>
            <div class="title" data-i18n="trackTitle">Track</div>
            <div class="sub" data-i18n="trackDesc">Kitchen</div>
          </div>
        </button>

        <button type="button" class="tile" id="checkout-card">
          <span class="badge" id="pay-badge">0</span>
          <div class="ico"><i class="fa-solid fa-receipt"></i></div>
          <div>
            <div class="title" id="pay-cta" data-i18n="payTitle">Bill</div>
            <div class="sub" data-i18n="payDesc">Pay</div>
          </div>
        </button>
      </div>
    </div>

    <p class="foot" id="waiter-switch" style="display:none"></p>
    <p class="foot" data-i18n="powered">RestroSuite</p>
  </div>

  <div class="overlay center" id="session-block" aria-hidden="true">
    <div class="sheet" role="alertdialog">
      <div class="block-ico" id="block-icon"><i class="fa-solid fa-lock"></i></div>
      <div class="block-t" id="block-title">Table closed</div>
      <p class="block-m" id="block-msg">Ask staff to open this table, then scan again.</p>
      <button type="button" class="btn btn-p" id="btn-retry-session"><i class="fa-solid fa-rotate"></i> <span data-i18n="retry">Retry</span></button>
    </div>
  </div>

  <div class="overlay" id="service-modal" aria-hidden="true">
    <div class="sheet" role="dialog">
      <div class="handle"></div>
      <div class="sh-head">
        <div class="sh-title" data-i18n="svcSheet">Need something?</div>
        <button type="button" class="x" data-close="service-modal" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="svc">
        <button type="button" class="svc-btn" data-svc="Drinking Water"><i class="fa-solid fa-glass-water"></i><span data-i18n="water">Water</span></button>
        <button type="button" class="svc-btn" data-svc="Cutlery / Plates"><i class="fa-solid fa-utensils"></i><span data-i18n="cutlery">Cutlery</span></button>
        <button type="button" class="svc-btn" data-svc="Clear Table"><i class="fa-solid fa-broom"></i><span data-i18n="clear">Clear</span></button>
        <button type="button" class="svc-btn" data-svc="General Assistant"><i class="fa-solid fa-hand"></i><span data-i18n="waiter">Waiter</span></button>
        <button type="button" class="svc-btn wide" data-svc="Request Printed Bill"><i class="fa-solid fa-receipt"></i><span data-i18n="bill">Printed bill</span></button>

  <div class="overlay" id="tracker-modal" aria-hidden="true">
    <div class="sheet" role="dialog">
      <div class="handle"></div>
      <div class="sh-head">
        <div class="sh-title" data-i18n="trackSheet">Your orders</div>
        <button type="button" class="x" data-close="tracker-modal" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="tracker-box"><div class="empty"><div class="spin"></div></div></div>
      <button type="button" class="btn btn-g" id="btn-refresh-track"><i class="fa-solid fa-rotate"></i> <span data-i18n="refresh">Refresh</span></button>
    </div>
  </div>

  <div class="overlay" id="checkout-modal" aria-hidden="true">
    <div class="sheet" role="dialog">
      <div class="handle"></div>
      <div class="sh-head">
        <div class="sh-title" data-i18n="paySheet">Bill</div>
        <button type="button" class="x" data-close="checkout-modal" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="checkout-box"><div class="empty"><div class="spin"></div></div></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script>
  function escHtml(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
  }

  (function () {
    'use strict';

    var params = new URLSearchParams(window.location.search);
    var slug = params.get('tenant') || params.get('outlet') || '';
    var table = params.get('table') || params.get('t') || '';
    var uiLang = (function () {
      try { return localStorage.getItem('rs_guest_lang') || 'en'; } catch (e) { return 'en'; }
    })();

    var I18N = {
      en: {
        offline: 'Offline — will retry',
        noApp: 'No app needed',
        menuTitle: 'Order food',
        menuDesc: 'Menu · kitchen · to your table',
        menuCta: 'Open',
        svcTitle: 'Service',
        svcDesc: 'Call staff',
        trackTitle: 'Track',
        trackDesc: 'Kitchen',
        payTitle: 'Bill',
        payDesc: 'Pay',
        powered: 'RestroSuite',
        svcSheet: 'Need something?',
        trackSheet: 'Your orders',
        paySheet: 'Bill',
        water: 'Water', cutlery: 'Cutlery', clear: 'Clear', waiter: 'Waiter',
        bill: 'Printed bill', refresh: 'Refresh', retry: 'Retry',
        tableOpen: 'Ready', tablePaused: 'Paused', tableClosed: 'Closed',
        table: 'Table',
        noOrders: 'No orders yet. Tap Order food first.',
        noBill: 'Nothing to pay yet. Order first.',
        settled: 'All settled. Thank you!',
        payLater: 'Pay later at counter',
        payUpi: 'Pay with UPI',
        submitUtr: 'Submit UTR',
        grand: 'Due',
        afterPay: 'After paying, enter 12-digit UTR',
        payCounter: 'Pay cash/card at counter — show this total',
        scanUpi: 'Scan with any UPI app',
        sent: 'Sent to staff',
        failed: 'Failed — try again',
        sessionNeeded: 'Ask staff to open this table',
        closedTitle: 'Table closed',
        closedMsg: 'Staff must open this table before you can order. Then scan the QR again.',
        pausedTitle: 'Paused',
        pausedMsg: 'Ordering is paused. Please call a waiter.',
        utrInvalid: 'Enter a valid 12-digit UTR',
        utrSent: 'UTR sent — cashier will verify',
        payLaterOk: 'Staff notified — pay at counter',
        openingStripe: 'Opening checkout…',
        staffWaiter: 'Staff: waiter KOT mode',
        staffGuest: 'Guest view',
        kotTitle: 'Waiter KOT',
        kotDesc: 'Kitchen tickets',
        fromKitchen: 'Kitchen',
        anyMoment: 'Any moment',
        estimated: 'ETA',
        stepPlaced: 'Placed',
        stepPlacedD: 'Waiting for kitchen',
        stepPrep: 'Cooking',
        stepPrepD: 'In the kitchen',
        stepServed: 'Served',
        stepServedD: 'At your table',
        stepPaid: 'Paid',
        stepPaidD: 'Settled'
      },
      hi: {
        offline: 'ऑफ़लाइन',
        noApp: 'ऐप नहीं',
        menuTitle: 'ऑर्डर करें',
        menuDesc: 'मेनू · किचन · टेबल पर',
        menuCta: 'खोलें',
        svcTitle: 'सर्विस',
        svcDesc: 'स्टाफ़ बुलाएँ',
        trackTitle: 'ट्रैक',
        trackDesc: 'किचन',
        payTitle: 'बिल',
        payDesc: 'भुगतान',
        powered: 'RestroSuite',
        svcSheet: 'कुछ चाहिए?',
        trackSheet: 'आपके ऑर्डर',
        paySheet: 'बिल',
        water: 'पानी', cutlery: 'कटलरी', clear: 'साफ़', waiter: 'वेटर',
        bill: 'प्रिंटेड बिल', refresh: 'रीफ़्रेश', retry: 'दोबारा',
        tableOpen: 'तैयार', tablePaused: 'रुका', tableClosed: 'बंद',
        table: 'टेबल',
        noOrders: 'अभी ऑर्डर नहीं। पहले ऑर्डर करें।',
        noBill: 'भुगतान नहीं। पहले ऑर्डर करें।',
        settled: 'सब क्लियर। धन्यवाद!',
        payLater: 'बाद में काउंटर पर',
        payUpi: 'UPI से भुगतान',
        submitUtr: 'UTR जमा',
        grand: 'देय',
        afterPay: 'भुगतान के बाद 12 अंक UTR',
        payCounter: 'काउंटर पर कैश/कार्ड',
        scanUpi: 'UPI ऐप से स्कैन',
        sent: 'स्टाफ़ को भेजा',
        failed: 'फेल — दोबारा',
        sessionNeeded: 'स्टाफ़ से टेबल खुलवाएँ',
        closedTitle: 'टेबल बंद',
        closedMsg: 'ऑर्डर से पहले स्टाफ़ को टेबल खोलनी होगी। फिर QR स्कैन करें।',
        pausedTitle: 'रुका हुआ',
        pausedMsg: 'ऑर्डरिंग रुकी है। वेटर बुलाएँ।',
        utrInvalid: 'सही 12 अंक UTR डालें',
        utrSent: 'UTR भेजा — कैशियर जाँचेंगे',
        payLaterOk: 'स्टाफ़ को बताया',
        openingStripe: 'चेकआउट…',
        staffWaiter: 'स्टाफ़: KOT मोड',
        staffGuest: 'गेस्ट व्यू',
        kotTitle: 'वेटर KOT',
        kotDesc: 'किचन टिकट',
        fromKitchen: 'किचन',
        anyMoment: 'जल्दी',
        estimated: 'समय',
        stepPlaced: 'मिला',
        stepPlacedD: 'किचन प्रतीक्षा',
        stepPrep: 'बन रहा',
        stepPrepD: 'किचन में',
        stepServed: 'परोसा',
        stepServedD: 'टेबल पर',
        stepPaid: 'भुगतान',
        stepPaidD: 'क्लियर'
      }
    };

    function t(k) {
      return (I18N[uiLang] && I18N[uiLang][k]) || I18N.en[k] || k;
    }

    function applyI18n() {
      document.querySelectorAll('[data-i18n]').forEach(function (el) {
        var k = el.getAttribute('data-i18n');
        if (k && t(k)) el.textContent = t(k);
      });
      var lb = document.getElementById('lang-btn');
      if (lb) lb.textContent = uiLang === 'hi' ? 'हिं' : 'EN';
      document.documentElement.lang = uiLang === 'hi' ? 'hi' : 'en';
    }

    if (!slug) {
      document.body.innerHTML =
        '<div style="text-align:center;padding:80px 24px;font-family:system-ui;max-width:320px;margin:0 auto">' +
        '<div style="font-size:40px;margin-bottom:10px">📱</div>' +
        '<h2 style="margin:0 0 6px;font-size:20px">Scan table QR</h2>' +
        '<p style="color:#8A847C;font-size:14px;line-height:1.45">Open only from your table QR code.</p></div>';
      return;
    }

    var isStaffDevice = false;
    try {
      isStaffDevice = !!(sessionStorage.getItem('tenant_session_token') || sessionStorage.getItem('tenant_id') ||
        localStorage.getItem('tenant_session_token'));
    } catch (e) {}
    var waiterMode = params.get('mode') === 'waiter';
    window.__RS_WAITER_MODE__ = waiterMode;

    var sessionToken = '';
    try {
      sessionToken = params.get('token') || params.get('session') || sessionStorage.getItem('qr_session_token') || '';
    } catch (e) {
      sessionToken = params.get('token') || params.get('session') || '';
    }
    var sessionStatus = 'unknown';
    var upiVpaAddress = '';
    var stripeEnabled = false;
    var currencySymbol = '₹';
    var liveOrders = [];
    var SU = '', SK = '', FN = '';

    function displayOrderId(id) {
      var raw = String(id || '');
      var m = raw.match(/^DO-(QR|WTR)-(\d{6})-(\d{3,})(?:-[A-Z0-9]+)?$/i);
      if (m) return m[1].toUpperCase() + '-' + m[2] + '-' + m[3];
      return raw.length > 18 ? raw.slice(0, 16) + '…' : raw;
    }
    function padTable(v) {
      if (!v) return '—';
      return /^\d+$/.test(String(v)) ? String(parseInt(v, 10)).padStart(2, '0') : String(v);
    }
    function money(n) {
      return (currencySymbol || '₹') + Math.round(Number(n) || 0);
    }

    function storeSession(token) {
      if (!token) return;
      sessionToken = token;
      try { sessionStorage.setItem('qr_session_token', token); } catch (e) {}
      try {
        if (params.get('token') !== token) {
          params.set('token', token);
          history.replaceState({}, '', location.pathname + '?' + params.toString() + (location.hash || ''));
        }
      } catch (e) {}
    }

    function apiCall(action, extra) {
      extra = extra || {};
      return (window.__configReady || Promise.resolve()).then(function () {
        SU = window.__SUPABASE_URL__ || (window.CONFIG && window.CONFIG.supabaseUrl) || SU;
        SK = window.__SUPABASE_ANON_KEY__ || (window.CONFIG && window.CONFIG.supabaseAnonKey) || SK;
        FN = (window.CONFIG && window.CONFIG.functions && window.CONFIG.functions.tenantPublic) ||
          (SU ? SU + '/functions/v1/tenant-public' : '');
        if (!FN) return Promise.reject(new Error('Config missing'));
        var tok = sessionToken || '';
        try { tok = tok || params.get('token') || sessionStorage.getItem('qr_session_token') || ''; } catch (e) {}
        return fetch(FN, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'apikey': SK, 'Authorization': 'Bearer ' + SK },
          body: JSON.stringify(Object.assign({
            action: action, tenant_slug: slug, table: table, session_token: tok
          }, extra))
        }).then(function (r) { return r.json().catch(function () { return {}; }); });
      });
    }

    function initBranding() {
      apiCall('list_menu').then(function (res) {
        if (!res || res.error) return;
        if (res.tenantName) {
          document.getElementById('brand-logo').textContent = res.tenantName;
          document.title = res.tenantName + ' · ' + padTable(table);
        }
        if (res.upiVpa) upiVpaAddress = res.upiVpa;
        if (res.currencySymbol) currencySymbol = res.currencySymbol;
        if (res.stripeEnabled) stripeEnabled = true;
        updateBadges();
      }).catch(function () {});
    }

    function setSessionUi(status) {
      sessionStatus = status || 'unknown';
      var pill = document.getElementById('session-pill');
      var banner = document.getElementById('sess-banner');
      var bannerTxt = document.getElementById('sess-banner-txt');
      var block = document.getElementById('session-block');
      if (!pill) return;
      pill.classList.add('on');
      pill.classList.remove('warn', 'bad');

      if (status === 'active') {
        document.getElementById('session-pill-txt').textContent = t('tableOpen');
        if (banner) banner.classList.remove('on', 'bad');
        if (block) { block.classList.remove('on'); block.setAttribute('aria-hidden', 'true'); }
        ['menu-btn', 'service-card', 'tracker-card', 'checkout-card'].forEach(function (id) {
          var el = document.getElementById(id);
          if (el) el.classList.remove('disabled');
        });
      } else if (status === 'paused') {
        pill.classList.add('warn');
        document.getElementById('session-pill-txt').textContent = t('tablePaused');
        if (banner) {
          banner.classList.add('on');
          banner.classList.remove('bad');
          if (bannerTxt) bannerTxt.textContent = t('pausedMsg');
        }
        if (block) { block.classList.remove('on'); block.setAttribute('aria-hidden', 'true'); }
        var menu = document.getElementById('menu-btn');
        var svc = document.getElementById('service-card');
        if (menu) menu.classList.add('disabled');
        if (svc) svc.classList.add('disabled');
      } else if (status === 'closed') {
        pill.classList.add('bad');
        document.getElementById('session-pill-txt').textContent = t('tableClosed');
        if (banner) {
          banner.classList.add('on', 'bad');
          if (bannerTxt) bannerTxt.textContent = t('closedMsg');
        }
        showSessionBlock('closed');
        ['menu-btn', 'service-card'].forEach(function (id) {
          var el = document.getElementById(id);
          if (el) el.classList.add('disabled');
        });
      }
    }

    function showSessionBlock(kind) {
      var block = document.getElementById('session-block');
      if (!block) return;
      var icon = document.getElementById('block-icon');
      var title = document.getElementById('block-title');
      var msg = document.getElementById('block-msg');
      if (kind === 'paused') {
        if (icon) { icon.className = 'block-ico warn'; icon.innerHTML = '<i class="fa-solid fa-pause"></i>'; }
        if (title) title.textContent = t('pausedTitle');
        if (msg) msg.textContent = t('pausedMsg');
      } else {
        if (icon) { icon.className = 'block-ico'; icon.innerHTML = '<i class="fa-solid fa-lock"></i>'; }
        if (title) title.textContent = t('closedTitle');
        if (msg) msg.textContent = t('closedMsg');
      }
      block.classList.add('on');
      block.setAttribute('aria-hidden', 'false');
    }

    function refreshSession() {
      if (waiterMode) {
        setSessionUi('active');
        return Promise.resolve({ active: true, status: 'active' });
      }
      if (!table) {
        setSessionUi('closed');
        return Promise.resolve({ active: false });
      }
      return apiCall('get_active_session', { table: table }).then(function (res) {
        if (res && res.active && res.status !== 'paused') {
          if (res.session_token) storeSession(res.session_token);
          setSessionUi('active');
          refreshLiveOrders();
        } else if (res && res.active && res.status === 'paused') {
          setSessionUi('paused');
        } else {
          setSessionUi('closed');
        }
        return res;
      }).catch(function () {
        if (sessionToken) setSessionUi('active');
        return null;
      });
    }

    function menuUrl(token) {
      if (location.protocol === 'file:' || !location.origin || location.origin === 'null') {
        return 'order.html?tenant=' + encodeURIComponent(slug) +
          (table ? '&table=' + encodeURIComponent(table) : '') +
          (token ? '&token=' + encodeURIComponent(token) : '') +
          (waiterMode ? '&mode=waiter' : '');
      }
      var path = location.pathname.replace(/qr-order\.html?$/i, 'order.html').replace(/\/qr-order\/?$/i, '/order');
      if (path === location.pathname) path = '/order';
      var u = new URL(location.origin + path);
      u.searchParams.set('tenant', slug);
      if (table) u.searchParams.set('table', table);
      if (token) u.searchParams.set('token', token);
      if (waiterMode) u.searchParams.set('mode', 'waiter');
      return u.toString();
    }

    function goMenu() {
      if (sessionStatus === 'closed' || sessionStatus === 'paused') {
        showSessionBlock(sessionStatus === 'paused' ? 'paused' : 'closed');
        return;
      }
      if (sessionToken) { location.href = menuUrl(sessionToken); return; }
      apiCall('get_active_session', { table: table }).then(function (res) {
        if (res && res.session_token) storeSession(res.session_token);
        if (res && res.active && res.status !== 'paused') {
          location.href = menuUrl(sessionToken || res.session_token || '');
        } else if (res && res.status === 'paused') {
          setSessionUi('paused'); showSessionBlock('paused');
        } else {
          setSessionUi('closed'); showSessionBlock('closed');
        }
      }).catch(function () { location.href = menuUrl(sessionToken || ''); });
    }

    function getLocalOrders() {
      try {
        var all = JSON.parse(localStorage.getItem('doppio_pending_qr_orders') || '[]');
        if (!Array.isArray(all)) return [];
        return all.filter(function (o) {
          if (o.tenant_slug && o.tenant_slug !== slug) return false;
          if (!table) return true;
          var tn = String(o.tableNumber || o.table || '');
          if (!tn) return true;
          if (tn === table || tn === 'Table ' + padTable(table) || tn.indexOf(table) >= 0) return true;
          var a = tn.replace(/\D/g, ''), b = String(table).replace(/\D/g, '');
          return a && b && String(parseInt(a, 10)) === String(parseInt(b, 10));
        });
      } catch (e) { return []; }
    }

    function mergeOrderLists(serverOrders, localOrders) {
      var map = {};
      (serverOrders || []).forEach(function (o) { if (o && o.orderId) map[o.orderId] = o; });
      (localOrders || []).forEach(function (o) {
        if (!o || !o.orderId || map[o.orderId]) return;
        map[o.orderId] = {
          orderId: o.orderId, status: o.status || 'Pending Review',
          items: o.items || [], total: Number(o.total) || 0,
          dateTime: o.dateTime || '', source: 'local'
        };
      });
      return Object.keys(map).map(function (k) { return map[k]; })
        .sort(function (a, b) { return String(b.dateTime || '').localeCompare(String(a.dateTime || '')); });
    }

    function openOrders(list) {
      return (list || []).filter(function (o) {
        return !/paid|settled|closed|cancelled|canceled|void/i.test(String(o.status || ''));
      });
    }

    function refreshLiveOrders() {
      var local = getLocalOrders();
      if (!sessionToken && !waiterMode) {
        liveOrders = mergeOrderLists([], local);
        updateBadges();
        return Promise.resolve(liveOrders);
      }
      return apiCall('get_table_orders', { table: table }).then(function (res) {
        liveOrders = mergeOrderLists(res && Array.isArray(res.orders) ? res.orders : [], local);
        updateBadges();
        return liveOrders;
      }).catch(function () {
        liveOrders = mergeOrderLists([], local);
        updateBadges();
        return liveOrders;
      });
    }

    function updateBadges() {
      var open = openOrders(liveOrders.length ? liveOrders : getLocalOrders());
      var n = open.length;
      var tb = document.getElementById('track-badge');
      var pb = document.getElementById('pay-badge');
      if (tb) { tb.textContent = String(n); tb.classList.toggle('on', n > 0); }
      if (pb) { pb.textContent = String(n); pb.classList.toggle('on', n > 0); }
      var total = open.reduce(function (s, o) { return s + (Number(o.total) || 0); }, 0);
      var cta = document.getElementById('pay-cta');
      var sub = document.querySelector('#checkout-card .sub');
      if (cta) cta.textContent = t('payTitle');
      if (sub) sub.textContent = total > 0 ? money(total) : t('payDesc');
    }

    function statusPillClass(st) {
      st = String(st || '').toLowerCase();
      if (/paid|settled/.test(st)) return 'p-paid';
      if (/served|ready|deliver/.test(st)) return 'p-serv';
      if (/prepar|accept|kot|cook/.test(st)) return 'p-prep';
      return 'p-pend';
    }
    function statusLabel(st) {
      st = String(st || 'Pending').trim();
      if (uiLang !== 'hi') return st;
      var map = {
        'pending review': 'प्रतीक्षा', pending: 'प्रतीक्षा', preparing: 'बन रहा',
        accepted: 'स्वीकृत', served: 'परोसा', paid: 'भुगतान', ready: 'तैयार'
      };
      return map[st.toLowerCase()] || st;
    }
    function activeStep(status) {
      var ns = String(status || '').toLowerCase();
      if (/paid|settled|closed/.test(ns)) return 3;
      if (/served|delivered|done/.test(ns)) return 2;
      if (/prepar|accept|kot|cook|ready/.test(ns)) return 1;
      return 0;
    }
    function parseItems(raw) {
      try {
        if (Array.isArray(raw)) return raw;
        if (typeof raw === 'string') return JSON.parse(raw);
      } catch (e) {}
      return [];
    }

    function openModal(id) {
      var el = document.getElementById(id);
      if (!el) return;
      el.classList.add('on');
      el.setAttribute('aria-hidden', 'false');
      if (id === 'tracker-modal') {
        pollOrderTrackers(false);
        if (window.__trackTimer) clearInterval(window.__trackTimer);
        window.__trackTimer = setInterval(function () { pollOrderTrackers(true); }, 5000);
      }
      if (id === 'checkout-modal') renderCheckoutSummary();
    }
    function closeModal(id) {
      var el = document.getElementById(id);
      if (!el) return;
      el.classList.remove('on');
      el.setAttribute('aria-hidden', 'true');
      if (id === 'tracker-modal' && window.__trackTimer) {
        clearInterval(window.__trackTimer);
        window.__trackTimer = null;
      }
    }
    document.querySelectorAll('[data-close]').forEach(function (b) {
      b.addEventListener('click', function () { closeModal(b.getAttribute('data-close')); });
    });
    document.querySelectorAll('.overlay').forEach(function (ov) {
      if (ov.id === 'session-block') return;
      ov.addEventListener('click', function (e) {
        if (e.target === ov) closeModal(ov.id);
      });
    });

    function showToast(msg) {
      var tEl = document.getElementById('toast');
      tEl.textContent = msg;
      tEl.classList.add('on');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(function () { tEl.classList.remove('on'); }, 2600);
    }

    function ensureSessionOrWarn() {
      if (waiterMode) return true;
      if (sessionStatus === 'active' && sessionToken) return true;
      if (sessionStatus === 'paused') { showSessionBlock('paused'); return false; }
      showToast(t('sessionNeeded'));
      refreshSession();
      return false;
    }

    document.querySelectorAll('.svc-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (!ensureSessionOrWarn()) return;
        var name = btn.getAttribute('data-svc');
        btn.disabled = true;
        apiCall('create_notification', {
          title: 'Table ' + padTable(table) + ' Call',
          message: 'Dine-in Customer requested: ' + name,
          type: 'waiter_call',
          table: table
        }).then(function (res) {
          if (res && (res.success || res.deduped) && !res.error) {
            showToast(t('sent') + ' · ' + name);
            closeModal('service-modal');
          } else showToast((res && res.error) || t('failed'));
        }).catch(function () { showToast(t('failed')); })
          .finally(function () { btn.disabled = false; });
      });
    });

    function renderOrderCard(o) {
      var status = o.status || 'Pending Review';
      var active = activeStep(status);
      var steps = [
        { title: t('stepPlaced'), desc: t('stepPlacedD') },
        { title: t('stepPrep'), desc: t('stepPrepD') },
        { title: t('stepServed'), desc: t('stepServedD') },
        { title: t('stepPaid'), desc: t('stepPaidD') }
      ];
      var items = parseItems(o.items);
      var itemsHtml = items.length ? '<div class="lines">' + items.map(function (it) {
        return '<div class="li"><span>' + escHtml((it.qty || 1) + '× ' + (it.name || '')) +
          '</span><span>' + escHtml(money((it.price || 0) * (it.qty || 1))) + '</span></div>';
      }).join('') + '</div>' : '';

      var eta = '';
      var pm = Number(o.prepMinutes || 0);
      if (pm > 0 && o.prepStartedAt && active === 1) {
        var started = new Date(o.prepStartedAt).getTime();
        var remain = Math.max(0, Math.ceil((started + pm * 60000 - Date.now()) / 60000));
        eta = '<div class="eta"><div style="font-size:10px;color:var(--muted)">' + escHtml(t('estimated')) +
          '</div><strong>' + (remain > 0 ? '~' + remain + ' min' : escHtml(t('anyMoment'))) + '</strong></div>';
      }
      var tl = steps.map(function (st, idx) {
        var cls = idx < active ? 'done' : (idx === active ? 'active' : '');
        return '<div class="ts ' + cls + '"><div class="td"></div><div class="tt">' + escHtml(st.title) +
          '</div><div class="tdesc">' + escHtml(st.desc) + '</div></div>';
      }).join('');
      var src = o.source === 'staff' ? ' · ' + t('fromKitchen') : '';
      return '<div class="ord"><div class="ord-h"><div><div class="oid">' + escHtml(displayOrderId(o.orderId)) +
        '</div><div class="om">' + escHtml(money(o.total)) +
        (o.dateTime ? ' · ' + escHtml(String(o.dateTime).slice(0, 16).replace('T', ' ')) : '') +
        escHtml(src) + '</div></div><span class="pill ' + statusPillClass(status) + '">' +
        escHtml(statusLabel(status)) + '</span></div>' + eta + '<div class="tl">' + tl + '</div>' + itemsHtml + '</div>';
    }

    function pollOrderTrackers(silent) {
      var box = document.getElementById('tracker-box');
      if (!silent) box.innerHTML = '<div class="empty"><div class="spin"></div></div>';
      refreshLiveOrders().then(function (list) {
        if (!list.length) {
          box.innerHTML = '<div class="empty"><i class="fa-solid fa-receipt"></i><p>' + escHtml(t('noOrders')) +
            '</p><button type="button" class="btn btn-p" id="go-menu-from-track">' + escHtml(t('menuCta')) + '</button></div>';
          var g = document.getElementById('go-menu-from-track');
          if (g) g.onclick = goMenu;
          return;
        }
        var open = openOrders(list);
        var paid = list.filter(function (o) { return /paid|settled/i.test(String(o.status || '')); }).slice(0, 2);
        var show = (open.length ? open : list).slice(0, 5);
        if (open.length && paid.length) show = show.concat(paid).slice(0, 6);
        box.innerHTML = show.map(renderOrderCard).join('');
      });
    }

    function renderCheckoutSummary() {
      var box = document.getElementById('checkout-box');
      box.innerHTML = '<div class="empty"><div class="spin"></div></div>';
      refreshLiveOrders().then(function (list) {
        var open = openOrders(list);
        if (!open.length) {
          var allPaid = list.length && list.every(function (o) {
            return /paid|settled/i.test(String(o.status || ''));
          });
          box.innerHTML = '<div class="empty"><i class="fa-solid fa-receipt"></i><p>' +
            escHtml(allPaid ? t('settled') : t('noBill')) + '</p>' +
            (!allPaid ? '<button type="button" class="btn btn-p" id="go-menu-pay">' + escHtml(t('menuCta')) + '</button>' : '') +
            '</div>';
          var g = document.getElementById('go-menu-pay');
          if (g) g.onclick = goMenu;
          return;
        }
        var total = open.reduce(function (s, o) { return s + (Number(o.total) || 0); }, 0);
        var symbol = currencySymbol || '₹';
        var lines = open.map(function (o) {
          return '<div class="br"><span>' + escHtml(displayOrderId(o.orderId)) +
            '</span><span>' + escHtml(money(o.total)) + '</span></div>';
        }).join('');
        var latest = open[0];
        var isInr = symbol === '₹' || symbol === 'Rs' || symbol === 'INR' || !symbol;
        var payHtml = '';
        if (isInr && upiVpaAddress) {
          var upiName = document.getElementById('brand-logo').textContent || 'Restaurant';
          var upiUrl = 'upi://pay?pa=' + encodeURIComponent(upiVpaAddress) +
            '&pn=' + encodeURIComponent(upiName) +
            '&am=' + encodeURIComponent(Number(total).toFixed(2)) +
            '&tr=' + encodeURIComponent(String(latest.orderId || '')) +
            '&tn=' + encodeURIComponent('Table ' + padTable(table) + ' Bill') + '&cu=INR';
          var qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(upiUrl);
          payHtml =
            '<div class="upi"><p style="font-size:12px;color:var(--muted)">' + escHtml(t('scanUpi')) + '</p>' +
            '<div class="qr"><img src="' + qrUrl + '" alt="UPI" width="168" height="168" loading="lazy"></div>' +
            '<a class="btn btn-p" href="' + escHtml(upiUrl) + '"><i class="fa-solid fa-mobile-screen-button"></i> ' +
            escHtml(t('payUpi')) + '</a></div>' +
            '<p class="lbl">' + escHtml(t('afterPay')) + '</p>' +
            '<input class="field" id="utr-input" inputmode="numeric" maxlength="12" placeholder="123456789012" autocomplete="off">' +
            '<button type="button" class="btn btn-d" id="btn-utr"><i class="fa-solid fa-shield-halved"></i> ' +
            escHtml(t('submitUtr')) + '</button>';
        } else if (stripeEnabled) {
          payHtml = '<button type="button" class="btn btn-p" id="btn-stripe"><i class="fa-solid fa-credit-card"></i> Pay ' +
            escHtml(symbol + Number(total).toFixed(2)) + '</button>';
        } else {
          payHtml = '<div class="empty" style="padding:12px"><i class="fa-solid fa-building-columns"></i><p>' +
            escHtml(t('payCounter')) + '</p></div>';
        }
        box.innerHTML = '<div class="bill">' + lines +
          '<div class="br tot"><span>' + escHtml(t('grand')) + '</span><span>' + escHtml(money(total)) +
          '</span></div></div>' + payHtml +
          '<button type="button" class="btn btn-g" id="btn-pay-later"><i class="fa-solid fa-clock"></i> ' +
          escHtml(t('payLater')) + '</button>';
        wirePayActions(open, total, latest);
      });
    }

    function wirePayActions(openList, total, latest) {
      var symbol = currencySymbol || '₹';
      var utrBtn = document.getElementById('btn-utr');
      if (utrBtn) {
        utrBtn.onclick = function () {
          if (!ensureSessionOrWarn()) return;
          var val = (document.getElementById('utr-input').value || '').trim().replace(/\s/g, '');
          if (val.length < 12) { showToast(t('utrInvalid')); return; }
          utrBtn.disabled = true;
          apiCall('create_notification', {
            title: 'Table ' + padTable(table) + ' Payment Check',
            message: 'UTR submitted: ' + val + ' for Order ID: ' + latest.orderId + ' · Amount ' + symbol + Math.round(total),
            type: 'payment_alert', table: table
          }).then(function (res) {
            if (res && (res.success || res.deduped) && !res.error) {
              showToast(t('utrSent')); closeModal('checkout-modal');
            } else showToast((res && res.error) || t('failed'));
          }).catch(function () { showToast(t('failed')); })
            .finally(function () { utrBtn.disabled = false; });
        };
      }
      var later = document.getElementById('btn-pay-later');
      if (later) {
        later.onclick = function () {
          if (!ensureSessionOrWarn()) return;
          later.disabled = true;
          apiCall('create_notification', {
            title: 'Table ' + padTable(table) + ' · Pay later',
            message: 'Guest will pay at counter. Due ' + symbol + Math.round(total) + ' · ' + openList.length + ' order(s)',
            type: 'payment_alert', table: table
          }).then(function (res) {
            if (res && (res.success || res.deduped) && !res.error) {
              showToast(t('payLaterOk')); closeModal('checkout-modal');
            } else showToast((res && res.error) || t('failed'));
          }).catch(function () { showToast(t('failed')); })
            .finally(function () { later.disabled = false; });
        };
      }
      var st = document.getElementById('btn-stripe');
      if (st) {
        st.onclick = function () {
          showToast(t('openingStripe'));
          (window.__configReady || Promise.resolve()).then(function () {
            return fetch((window.__SUPABASE_URL__ || '') + '/functions/v1/stripe-connect', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'apikey': window.__SUPABASE_ANON_KEY__ || '' },
              body: JSON.stringify({
                action: 'create_checkout_session', tenant_slug: slug,
                order_id: latest.orderId, amount: total, table: table
              })
            }).then(function (r) { return r.json(); });
          }).then(function (res) {
            if (res && res.checkout_url) location.href = res.checkout_url;
            else showToast((res && res.error) || t('failed'));
          }).catch(function () { showToast(t('failed')); });
        };
      }
    }

    document.getElementById('table-label').textContent = t('table') + ' ' + padTable(table);
    document.getElementById('brand-logo').textContent = slug
      .replace(/-/g, ' ').replace(/\b\w/g, function (c) { return c.toUpperCase(); });

    if (waiterMode) {
      var sc = document.getElementById('service-card');
      var cc = document.getElementById('checkout-card');
      if (sc) sc.style.display = 'none';
      if (cc) cc.style.display = 'none';
      var mt = document.querySelector('#menu-btn .title');
      var md = document.querySelector('#menu-btn .sub span');
      if (mt) mt.textContent = t('kotTitle');
      if (md) md.textContent = t('kotDesc');
      var row = document.querySelector('.row3');
      if (row) {
        row.style.gridTemplateColumns = '1fr';
        document.getElementById('tracker-card').style.maxWidth = '160px';
      }
    }

    if (isStaffDevice) {
      var ws = document.getElementById('waiter-switch');
      if (ws) {
        ws.style.display = 'block';
        var u = new URL(location.href);
        if (waiterMode) u.searchParams.delete('mode');
        else u.searchParams.set('mode', 'waiter');
        ws.innerHTML = '<a href="' + escHtml(u.toString()) + '">' +
          escHtml(waiterMode ? t('staffGuest') : t('staffWaiter')) + '</a>';
      }
    }

    function wire(el, fn) {
      if (!el) return;
      el.addEventListener('click', function (e) {
        if (el.tagName === 'A') e.preventDefault();
        if (el.classList.contains('disabled')) return;
        fn();
      });
    }
    wire(document.getElementById('menu-btn'), goMenu);
    wire(document.getElementById('service-card'), function () {
      if (!ensureSessionOrWarn()) return;
      openModal('service-modal');
    });
    wire(document.getElementById('tracker-card'), function () { openModal('tracker-modal'); });
    wire(document.getElementById('checkout-card'), function () { openModal('checkout-modal'); });

    document.getElementById('btn-refresh-track').onclick = function () { pollOrderTrackers(false); };
    document.getElementById('btn-retry-session').onclick = function () { refreshSession(); };
    document.getElementById('sess-banner-refresh').onclick = function () { refreshSession(); };

    document.getElementById('lang-btn').onclick = function () {
      uiLang = uiLang === 'hi' ? 'en' : 'hi';
      try { localStorage.setItem('rs_guest_lang', uiLang); } catch (e) {}
      applyI18n();
      document.getElementById('table-label').textContent = t('table') + ' ' + padTable(table);
      if (sessionStatus === 'active' || sessionStatus === 'paused' || sessionStatus === 'closed') {
        setSessionUi(sessionStatus);
      }
      updateBadges();
      if (waiterMode) {
        var mt = document.querySelector('#menu-btn .title');
        var md = document.querySelector('#menu-btn .sub span');
        if (mt) mt.textContent = t('kotTitle');
        if (md) md.textContent = t('kotDesc');
      }
    };

    function syncNet() {
      document.getElementById('offline').classList.toggle('on', !navigator.onLine);
    }
    window.addEventListener('online', function () { syncNet(); refreshSession(); });
    window.addEventListener('offline', syncNet);
    syncNet();

    function openDeepLinks() {
      if (params.get('track') === '1') setTimeout(function () { openModal('tracker-modal'); }, 250);
      if (params.get('pay') === '1') setTimeout(function () { openModal('checkout-modal'); }, 250);
      if (params.get('service') === '1') setTimeout(function () {
        if (sessionStatus === 'active') openModal('service-modal');
      }, 250);
    }

    applyI18n();
    initBranding();
    refreshSession().then(openDeepLinks);
    setInterval(function () {
      if (sessionToken || waiterMode) refreshLiveOrders();
      else updateBadges();
    }, 10000);
    setInterval(function () { if (!waiterMode) refreshSession(); }, 45000);
  })();
  </script>
  <script src="pwa.js"></script>
</body>
</html>
