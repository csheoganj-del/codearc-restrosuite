<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RestroSuite Update</title>
<style>
  :root {
    --bg: #12151c;
    --card: #1a1f2b;
    --stroke: rgba(255,255,255,.08);
    --text: #f4f6fb;
    --mute: #8b93a7;
    --orange: #FF4F00;
    --orange-2: #ff7a3d;
    --ok: #22c55e;
    --warn: #f59e0b;
    --err: #ef4444;
    --ease: cubic-bezier(.2,.8,.2,1);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    background: transparent;
    color: var(--text);
    -webkit-user-select: none;
    user-select: none;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
  }
  .card {
    width: 100%;
    max-width: 400px;
    background: linear-gradient(165deg, #1c2230 0%, #141822 100%);
    border: 1px solid var(--stroke);
    border-radius: 18px;
    box-shadow: 0 24px 60px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.04) inset;
    padding: 22px 22px 18px;
    position: relative;
  }
  .eyebrow {
    color: var(--orange);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .1em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  h1 {
    margin: 0 0 6px;
    font-size: 18px;
    font-weight: 700;
    line-height: 1.25;
    letter-spacing: -.01em;
  }
  .detail {
    margin: 0 0 16px;
    color: var(--mute);
    font-size: 13px;
    line-height: 1.45;
    min-height: 36px;
  }
  .version {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--mute);
    margin-bottom: 14px;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(255,255,255,.04);
    border: 1px solid var(--stroke);
  }
  .version strong { color: var(--text); font-weight: 700; }

  /* Progress */
  .track {
    height: 8px;
    border-radius: 99px;
    background: rgba(255,255,255,.08);
    overflow: hidden;
    position: relative;
  }
  .bar {
    height: 100%;
    width: 0%;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--orange), var(--orange-2));
    transition: width .25s var(--ease);
    box-shadow: 0 0 12px rgba(255,79,0,.45);
  }
  .bar.indeterminate {
    width: 40% !important;
    animation: slide 1.15s infinite ease-in-out;
  }
  .bar.success {
    width: 100% !important;
    background: linear-gradient(90deg, #16a34a, #22c55e);
    box-shadow: 0 0 12px rgba(34,197,94,.4);
    animation: none;
  }
  .bar.error {
    width: 100% !important;
    background: linear-gradient(90deg, #dc2626, #ef4444);
    box-shadow: none;
    animation: none;
  }
  @keyframes slide {
    0% { transform: translateX(-120%); }
    100% { transform: translateX(320%); }
  }
  .meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
    font-size: 12px;
    color: var(--mute);
  }
  .meta #pct { font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }

  /* Status icon */
  .hero {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }
  .icon {
    width: 44px; height: 44px;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    background: rgba(255,79,0,.12);
    border: 1px solid rgba(255,79,0,.25);
    flex-shrink: 0;
  }
  .icon.ok {
    background: rgba(34,197,94,.12);
    border-color: rgba(34,197,94,.3);
  }
  .icon.err {
    background: rgba(239,68,68,.12);
    border-color: rgba(239,68,68,.3);
  }
  .icon .spin {
    width: 18px; height: 18px;
    border: 2.5px solid rgba(255,79,0,.25);
    border-top-color: var(--orange);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 18px;
  }
  .btn {
    appearance: none;
    border: 0;
    border-radius: 11px;
    padding: 10px 16px;
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .12s var(--ease), background .15s, opacity .15s;
  }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn-ghost {
    background: rgba(255,255,255,.06);
    color: var(--text);
    border: 1px solid var(--stroke);
  }
  .btn-ghost:hover:not(:disabled) { background: rgba(255,255,255,.1); }
  .btn-primary {
    background: linear-gradient(180deg, var(--orange-2), var(--orange));
    color: #fff;
    box-shadow: 0 8px 20px rgba(255,79,0,.28);
  }
  .btn-primary:hover:not(:disabled) { filter: brightness(1.06); }
  .btn-ok {
    background: linear-gradient(180deg, #34d399, #16a34a);
    color: #fff;
    box-shadow: 0 8px 20px rgba(34,197,94,.25);
  }
  .hidden { display: none !important; }

  .success-burst {
    animation: pop .45s var(--ease);
  }
  @keyframes pop {
    0% { transform: scale(.86); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="eyebrow" id="eyebrow">RestroSuite update</div>
    <div class="hero">
      <div class="icon" id="icon"><div class="spin"></div></div>
      <div>
        <h1 id="title">Checking for updates…</h1>
        <div class="version hidden" id="verWrap"><strong id="verText">—</strong></div>
      </div>
    </div>
    <p class="detail" id="detail">Looking for the latest features and fixes on the live server.</p>

    <div id="progressBlock">
      <div class="track"><div class="bar indeterminate" id="bar"></div></div>
      <div class="meta">
        <span id="statusLine">Please wait…</span>
        <span id="pct"></span>
      </div>
    </div>

    <div class="actions" id="actions">
      <button type="button" class="btn btn-ghost hidden" id="btnLater">Later</button>
      <button type="button" class="btn btn-primary hidden" id="btnPrimary">Update now</button>
    </div>
  </div>

<script>
(function () {
  const { ipcRenderer } = require('electron');
  const $ = (id) => document.getElementById(id);

  const els = {
    eyebrow: $('eyebrow'),
    title: $('title'),
    detail: $('detail'),
    icon: $('icon'),
    bar: $('bar'),
    statusLine: $('statusLine'),
    pct: $('pct'),
    verWrap: $('verWrap'),
    verText: $('verText'),
    progressBlock: $('progressBlock'),
    btnLater: $('btnLater'),
    btnPrimary: $('btnPrimary'),
    card: $('card'),
  };

  function setIcon(kind) {
    if (kind === 'spin') {
      els.icon.className = 'icon';
      els.icon.innerHTML = '<div class="spin"></div>';
    } else if (kind === 'ok') {
      els.icon.className = 'icon ok';
      els.icon.innerHTML = '✓';
    } else if (kind === 'err') {
      els.icon.className = 'icon err';
      els.icon.innerHTML = '!';
    } else if (kind === 'cloud') {
      els.icon.className = 'icon';
      els.icon.innerHTML = '↓';
    } else {
      els.icon.className = 'icon';
      els.icon.innerHTML = 'i';
    }
  }

  function showButtons(laterLabel, primaryLabel, primaryClass) {
    if (laterLabel) {
      els.btnLater.textContent = laterLabel;
      els.btnLater.classList.remove('hidden');
    } else {
      els.btnLater.classList.add('hidden');
    }
    if (primaryLabel) {
      els.btnPrimary.textContent = primaryLabel;
      els.btnPrimary.className = 'btn ' + (primaryClass || 'btn-primary');
      els.btnPrimary.classList.remove('hidden');
      els.btnPrimary.disabled = false;
    } else {
      els.btnPrimary.classList.add('hidden');
    }
  }

  function hideButtons() {
    els.btnLater.classList.add('hidden');
    els.btnPrimary.classList.add('hidden');
  }

  function applyState(s) {
    if (!s || !s.phase) return;
    const phase = s.phase;

    if (s.version) {
      els.verWrap.classList.remove('hidden');
      els.verText.textContent = s.version;
    }

    if (phase === 'checking') {
      setIcon('spin');
      els.eyebrow.textContent = 'Checking';
      els.title.textContent = 'Checking for updates…';
      els.detail.textContent = s.detail || 'Looking for the latest features and fixes on the live server.';
      els.bar.className = 'bar indeterminate';
      els.statusLine.textContent = 'Connecting…';
      els.pct.textContent = '';
      els.progressBlock.classList.remove('hidden');
      hideButtons();
    }

    if (phase === 'current') {
      setIcon('ok');
      els.eyebrow.textContent = 'Up to date';
      els.title.textContent = 'You have the latest features';
      els.detail.textContent = s.detail || ('UI ' + (s.version || '') + ' is current. No download needed.');
      els.bar.className = 'bar success';
      els.statusLine.textContent = 'All set';
      els.pct.textContent = '100%';
      showButtons(null, 'Done', 'btn-ok');
      els.card.classList.add('success-burst');
    }

    if (phase === 'available') {
      setIcon('cloud');
      els.eyebrow.textContent = 'Update available';
      els.title.textContent = s.title || ('RestroSuite ' + (s.version || '') + ' is ready');
      els.detail.textContent = s.detail || 'New screens and fixes. Your bills and login stay safe.';
      els.bar.className = 'bar';
      els.bar.style.width = '0%';
      els.statusLine.textContent = s.localVersion ? ('You have ' + s.localVersion) : 'Ready to install';
      els.pct.textContent = '';
      els.progressBlock.classList.remove('hidden');
      showButtons('Later', 'Update now', 'btn-primary');
    }

    if (phase === 'installing' || phase === 'progress') {
      setIcon('spin');
      els.eyebrow.textContent = 'Installing';
      els.title.textContent = s.title || 'Updating RestroSuite…';
      els.detail.textContent = s.detail || 'Downloading the latest screens. This only takes a moment.';
      const total = Number(s.total) || 0;
      const done = Number(s.done) || 0;
      const pct = total > 0 ? Math.min(100, Math.round((done / total) * 100)) : 0;
      if (total > 0) {
        els.bar.className = 'bar';
        els.bar.style.width = pct + '%';
        els.statusLine.textContent = done + ' of ' + total + ' files';
        els.pct.textContent = pct + '%';
      } else {
        els.bar.className = 'bar indeterminate';
        els.statusLine.textContent = s.statusLine || 'Downloading…';
        els.pct.textContent = '';
      }
      hideButtons();
    }

    if (phase === 'success') {
      setIcon('ok');
      els.eyebrow.textContent = 'Success';
      els.title.textContent = s.title || ('RestroSuite ' + (s.version || '') + ' installed');
      els.detail.textContent = s.detail || 'Reload to use the new screens. Your data is safe.';
      els.bar.className = 'bar success';
      els.bar.style.width = '100%';
      els.statusLine.textContent = s.statusLine || 'Update complete';
      els.pct.textContent = '100%';
      showButtons('Later', 'Reload now', 'btn-ok');
      els.card.classList.add('success-burst');
    }

    if (phase === 'error') {
      setIcon('err');
      els.eyebrow.textContent = 'Update failed';
      els.title.textContent = s.title || 'Could not install update';
      els.detail.textContent = s.detail || 'Check your internet connection and try again.';
      els.bar.className = 'bar error';
      els.statusLine.textContent = 'Failed';
      els.pct.textContent = '';
      showButtons(null, 'Close', 'btn-ghost');
    }
  }

  els.btnLater.addEventListener('click', () => {
    ipcRenderer.send('rs-update-ui-action', { action: 'later' });
  });
  els.btnPrimary.addEventListener('click', () => {
    const label = (els.btnPrimary.textContent || '').toLowerCase();
    let action = 'primary';
    if (label.includes('reload')) action = 'reload';
    else if (label.includes('update')) action = 'install';
    else if (label.includes('done') || label.includes('close')) action = 'close';
    ipcRenderer.send('rs-update-ui-action', { action });
  });

  ipcRenderer.on('rs-update-ui-state', (_e, state) => applyState(state || {}));
  ipcRenderer.send('rs-update-ui-ready');
})();
</script>
</body>
</html>
