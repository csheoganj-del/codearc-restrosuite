<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FF4F00">
    <title>Page Not Found - RestroSuite</title>
    <link rel="icon" href="assets/restrosuite-mark.png?v=7" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #1A1714;
            --ink-soft: #4A453F;
            --muted: #6E675F;
            --paper: #F3EFE8;
            --surface: #ffffff;
            --surface-soft: #F7F4EE;
            --brand: #FF4F00;
            --brand-dark: #D94300;
            --accent: #5B6C8F;
            --success: #1F8A5B;
            --border-color: rgba(26,23,20,0.12);
            --shadow-lg: 0 20px 48px rgba(40,30,20,0.12);
            --transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'DM Sans', system-ui, sans-serif;
            background: var(--paper);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ink);
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .error-code {
            font-family: 'Fraunces', Georgia, serif;
            font-size: clamp(80px, 20vw, 140px);
            font-weight: 700;
            line-height: 1;
            color: var(--brand);
            margin-bottom: 16px;
        }

        .title {
            font-family: 'Fraunces', Georgia, serif;
            font-size: clamp(24px, 5vw, 34px);
            font-weight: 700;
            margin-bottom: 12px;
        }

        .subtitle {
            font-size: 16px;
            color: var(--muted);
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 15px;
            text-decoration: none;
            cursor: pointer;
            transition: var(--transition);
            border: none;
        }

        .btn-primary {
            background: var(--brand);
            color: #fff;
            box-shadow: 0 10px 24px rgba(243, 111, 33, 0.20);
        }

        .btn-primary:hover {
            background: var(--brand-dark);
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(201, 79, 11, 0.24);
        }

        .btn-secondary {
            background: var(--surface);
            color: var(--ink);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            border-color: var(--ink);
            transform: translateY(-2px);
        }

        .illustration {
            margin: 40px 0;
        }

        .illustration i {
            font-size: 80px;
            color: var(--brand);
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-code">404</div>
        <h1 class="title">Page Not Found</h1>
        <p class="subtitle">The page you're looking for doesn't exist or has been moved. Let's get you back on track!</p>
        
        <div class="btn-group">
            <a href="index.html" class="btn btn-primary">
                <i class="fas fa-home"></i> Back to Home
            </a>
            <a href="login.html" class="btn btn-secondary">
                <i class="fas fa-sign-in-alt"></i> Go to Login
            </a>
        </div>
    </div>

    <script>
        // Optional: Track 404 errors for analytics
        console.log('404 error: Page not found');
    </script>
</body>
</html>
