<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RestroSuite</title>
<style>
  html,body{height:100%;margin:0}
  body{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:#0f1115;color:#fff;font-family:system-ui,Segoe UI,Roboto,sans-serif;
    -webkit-user-select:none;user-select:none;
  }
  .mark{
    width:84px;height:84px;border-radius:20px;
    background:linear-gradient(135deg,#FF4F00,#ff5e3a);
    display:flex;align-items:center;justify-content:center;
    font-size:40px;font-weight:800;color:#fff;box-shadow:0 12px 40px rgba(252,128,25,.35);
  }
  h1{font-size:20px;margin:22px 0 4px;font-weight:700;letter-spacing:.2px}
  p{margin:0;color:#8b93a7;font-size:13px}
  .bar{margin-top:22px;width:180px;height:4px;border-radius:4px;background:#1e2230;overflow:hidden}
  .bar i{display:block;height:100%;width:40%;border-radius:4px;
    background:linear-gradient(90deg,#FF4F00,#ff5e3a);animation:load 1.1s infinite ease-in-out}
  @keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}
</style>
</head>
<body>
  <div class="mark">R</div>
  <h1>RestroSuite</h1>
  <p>Starting your restaurant workspace…</p>
  <div class="bar"><i></i></div>
</body>
</html>
