<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>RestroSuite · Nagpur postcard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,600;9..40,700;9..40,800&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* Classic portrait postcard ~ 4×6 ratio (1080 × 1620) */
  html, body {
    width: 1080px;
    height: 1620px;
    overflow: hidden;
    font-family: 'DM Sans', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: 1080px;
    height: 1620px;
    position: relative;
    background: url('../assets/wa-nagpur-bg.jpg') center / cover no-repeat;
  }

  /* Soft edge frame like a real printed postcard */
  .card::after {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    box-shadow: inset 0 0 0 18px rgba(252,248,242,0.92);
    border-radius: 2px;
  }

  /* Top brand — tiny, does not cover the art */
  .brand {
    position: absolute;
    top: 48px;
    left: 48px;
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(255,252,247,0.88);
    border: 1px solid rgba(255,255,255,0.85);
    border-radius: 999px;
    padding: 8px 16px 8px 8px;
    box-shadow: 0 10px 28px rgba(80,35,8,0.12);
    z-index: 2;
  }
  .brand img {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    object-fit: cover;
    background: #fff;
  }
  .brand .t h1 {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.03em;
    color: #1A1714;
    line-height: 1.05;
  }
  .brand .t h1 span { color: #FF4F00; }
  .brand .t p {
    font-size: 11px;
    font-weight: 600;
    color: #6E675F;
    margin-top: 2px;
  }

  .city-pill {
    position: absolute;
    top: 56px;
    right: 48px;
    z-index: 2;
    background: rgba(255,252,247,0.88);
    border: 1px solid rgba(255,255,255,0.85);
    color: #D94300;
    font-size: 13px;
    font-weight: 700;
    padding: 10px 16px;
    border-radius: 999px;
    box-shadow: 0 8px 22px rgba(80,35,8,0.1);
  }

  /* Message strip — bottom third only, soft paper */
  .msg {
    position: absolute;
    left: 48px;
    right: 48px;
    bottom: 48px;
    z-index: 2;
    background: rgba(255,252,247,0.92);
    border: 1px solid rgba(255,255,255,0.9);
    border-radius: 24px;
    padding: 28px 30px 24px;
    box-shadow: 0 16px 40px rgba(60,28,8,0.16);
    text-align: center;
  }
  .msg .eyebrow {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #FF4F00;
    margin-bottom: 10px;
  }
  .msg h2 {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -0.035em;
    line-height: 1.18;
    color: #1A1714;
    margin-bottom: 10px;
  }
  .msg h2 em {
    font-style: normal;
    color: #FF4F00;
  }
  .msg .line {
    font-size: 16px;
    font-weight: 500;
    color: #3F3A35;
    line-height: 1.45;
    max-width: 820px;
    margin: 0 auto 16px;
  }
  .msg .url {
    display: inline-block;
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, #FF4F00, #E04500);
    padding: 11px 20px;
    border-radius: 12px;
    margin-bottom: 14px;
    box-shadow: 0 6px 16px rgba(255,79,0,0.28);
  }
  .msg .by {
    font-size: 13px;
    font-weight: 600;
    color: #6E675F;
  }
  .msg .by b { color: #1A1714; }
</style>
</head>
<body>
  <!-- Pure Orange City postcard + light brand only -->
  <div class="card">
    <div class="brand">
      <img src="../assets/restrosuite-mark-512.png" alt="RestroSuite" />
      <div class="t">
        <h1>Restro<span>Suite</span></h1>
        <p>by CodeArc</p>
      </div>
    </div>
    <div class="city-pill">🍊 Orange City · Nagpur</div>

    <div class="msg">
      <div class="eyebrow">For Nagpur restaurants</div>
      <h2>Bill even when <em>Wi‑Fi dies</em></h2>
      <p class="line">
        Offline POS · kitchen · QR · WhatsApp receipts — free during launch.
      </p>
      <div class="url">restrosuite.codearc.co.in</div>
      <p class="by">
        <b>CodeArc</b> · Man Singh Gurjar · Call +91 73002 00949
      </p>
    </div>
  </div>
</body>
</html>
