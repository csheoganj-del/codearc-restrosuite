name: Lighthouse & k6 checks

on:
  workflow_dispatch:
  pull_request:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chromium and Lighthouse
        run: |
          sudo apt-get update -y
          sudo apt-get install -y chromium-browser chromium
          npm install -g lighthouse

      - name: Run Lighthouse
        env:
          CHROME_PATH: /usr/bin/chromium-browser
        run: |
          mkdir -p artifacts /tmp/chrome-temp
          export TMPDIR=/tmp/chrome-temp
          # Use explicit chrome path and flags to avoid sandbox / shm issues on GitHub runners
          lighthouse "https://restrosuite.codearc.co.in" --output=json --output-path=artifacts/lighthouse.json --chrome-path=$CHROME_PATH --chrome-flags="--no-sandbox --disable-dev-shm-usage --disable-setuid-sandbox"

      - name: Upload Lighthouse artifact
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: artifacts/lighthouse.json

  k6:
    runs-on: ubuntu-latest
    needs: lighthouse
    steps:
      - uses: actions/checkout@v4

      - name: Run k6 load test
        uses: grafana/k6-action@v2
        with:
          args: run --vus 50 --duration 30s --out json=./k6-output/result.json ./ci/k6-script.js

      - name: Upload k6 results
        uses: actions/upload-artifact@v4
        with:
          name: k6-results
          path: ./k6-output/result.json
