name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, check & test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build critical JS bundle
        run: npm run build:critical

      - name: JS syntax check and asset parity
        run: npm run check
        env:
          SKIP_ANDROID_BUILD: "1"

      - name: ESLint (strict rules — no-var, curly, eqeqeq, no-undef, etc.)
        run: npm run lint:ci

      - name: Dependency audit (high)
        run: npm audit --audit-level=high

      - name: Run test suite
        run: npm test

      - name: E2E smoke
        run: npm run test:e2e

      - name: Free-tier limits check
        run: npm run check:free-tier

      - name: Launch readiness (offline gates)
        run: npm run check:launch
        env:
          SKIP_LIVE_LAUNCH_CHECK: "1"

      - name: DR structure drill
        run: npm run drill:backup:structure

  e2e-browser:
    name: Playwright browser smoke
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build critical bundle
        run: npm run build:critical

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Performance gate (static build)
        run: npm run perf:ci

      - name: Accessibility gate (axe)
        run: npm run a11y:ci

      - name: DR structure drill
        run: npm run drill:backup:structure

      - name: Production Web Vitals (field probe)
        run: npm run perf:prod
        continue-on-error: true
        env:
          MAX_LCP_MS: "4500"
          MAX_FCP_MS: "3500"
          MAX_TTFB_MS: "1500"

      - name: Run Playwright smoke
        run: npm run test:e2e:browser
        env:
          CI: "1"

  deploy-preview:
    name: Vercel preview (PRs only)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy preview to Vercel
        run: npx vercel --token "$VERCEL_TOKEN" --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
